services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: shortener
      MYSQL_USER: shortener
      MYSQL_PASSWORD: shortener
      MYSQL_ROOT_PASSWORD: rootpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: change-me
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: mysql
      DB_NAME: shortener
      DB_USER: shortener
      DB_PASSWORD: shortener
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
